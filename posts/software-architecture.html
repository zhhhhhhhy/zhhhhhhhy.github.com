<!DOCTYPE html>

<head>

<style>
:root{
  --bg:#0b0e11;--panel:#12161c;--line:#1f2730;--line2:#2a3542;
  --text:#d8e0e9;--muted:#7d899c;--dim:#56606f;
  --accent:#ffb454;--accent2:#7fd1c1;--radius:14px;
  --font-disp:'Space Grotesk','Noto Sans SC',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.9;font-size:17px;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:#ffcc85}
::selection{background:rgba(255,180,84,.28);color:#fff}
.container{max-width:760px;margin:0 auto;padding:0 22px}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,14,17,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:54px;max-width:760px;margin:0 auto;padding:0 22px}
.back{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.back:hover{color:var(--accent)}
.brand{font-family:var(--font-mono);font-size:13px;color:var(--dim)}
.brand b{color:var(--accent)}

/* 文章 */
article{padding:52px 0 40px}
.post-kicker{font-family:var(--font-mono);color:var(--accent2);font-size:14px;letter-spacing:1px;margin-bottom:16px}
.post-kicker::before{content:"~/posts/";color:var(--dim)}
h1.title{font-family:var(--font-disp);font-size:clamp(28px,4.5vw,38px);font-weight:700;line-height:1.25;letter-spacing:-.5px;margin-bottom:14px}
.post-meta{font-family:var(--font-mono);font-size:13px;color:var(--dim);margin-bottom:34px;display:flex;gap:18px;flex-wrap:wrap}
.post-meta .tag{color:var(--accent2)}

/* 正文 */
.body p{margin-bottom:20px;color:var(--text);font-weight:300}
.body strong{color:#fff;font-weight:500}
.body blockquote{margin:26px 0;padding:18px 22px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;color:var(--text);font-weight:300}
.body blockquote .qk{display:block;font-family:var(--font-mono);color:var(--accent2);font-size:13px;margin-bottom:8px}

.end-mark{margin:44px 0 8px;font-family:var(--font-mono);color:var(--dim);font-size:14px}
.divider{height:1px;background:var(--line);margin:8px 0 30px}

footer{padding:20px 0 60px;color:var(--dim);font-family:var(--font-mono);font-size:13px}
.foot-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.foot-row a{color:var(--muted)}
.foot-row a:hover{color:var(--accent)}
@media(max-width:560px){body{font-size:16px}}
</style>
</head>

</div>
